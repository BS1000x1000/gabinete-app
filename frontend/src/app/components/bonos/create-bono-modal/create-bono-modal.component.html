<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-card-header">
      <div class="modal-card-icon icon-bono">
        <i class="bi bi-ticket-perforated"></i>
      </div>
      <div>
        <h5 class="mb-0">Nuevo bono</h5>
        <p class="text-muted small mb-0">Configura las sesiones y el precio</p>
      </div>
      <button class="btn-close-modal" (click)="cerrar.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-card-body">
      <div class="create-bono-form">

        <!-- Tipo de terapia -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-tag me-1"></i>Tipo de terapia
          </label>
          <select
            class="form-select"
            [ngModel]="tipoSesion()"
            (ngModelChange)="tipoSesion.set($event)"
          >
            <option *ngFor="let tipo of tipoSesionOpciones" [value]="tipo">
              {{ tipoSesionLabels[tipo] }}
            </option>
          </select>
        </div>

        <!-- Nº de sesiones -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-collection me-1"></i>Número de sesiones
          </label>
          <div class="sesiones-selector">
            <button
              *ngFor="let n of opcionesSesiones"
              class="sesiones-btn"
              [class.active]="!usarCustomSesiones() && sesionesSeleccionadas() === n"
              type="button"
              (click)="selectSesiones(n)"
            >
              {{ n }}
            </button>
            <div class="sesiones-custom-input">
              <button
                class="sesiones-btn"
                [class.active]="usarCustomSesiones()"
                type="button"
                (click)="activarCustom()"
              >
                Otro
              </button>
              <input
                *ngIf="usarCustomSesiones()"
                type="number"
                class="form-control form-control-sm"
                min="1"
                placeholder="Nº"
                [ngModel]="customSesiones()"
                (ngModelChange)="customSesiones.set($event)"
              />
            </div>
          </div>
        </div>

        <!-- Precio -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-currency-euro me-1"></i>Precio del bono
          </label>
          <div class="input-group">
            <input
              type="number"
              class="form-control"
              placeholder="0.00"
              min="0"
              step="0.01"
              [ngModel]="precioInput()"
              (ngModelChange)="precioInput.set($event)"
            />
            <span class="input-group-text">€</span>
          </div>
        </div>

        <!-- Preview precio/sesión -->
        <div *ngIf="precioInput() > 0 && sesionesFinales > 0" class="precio-preview">
          <span class="text-muted">Precio por sesión</span>
          <strong>{{ precioInput() / sesionesFinales | number:'1.2-2' }} €</strong>
        </div>

        <!-- Familiar responsable (opcional) -->
        <div class="form-group-custom" *ngIf="familiares.length > 0">
          <label class="form-label-custom">
            <i class="bi bi-person me-1"></i>Responsable de pago
            <span class="text-muted fw-normal">(opcional)</span>
          </label>
          <select
            class="form-select"
            [ngModel]="familiarPagoId()"
            (ngModelChange)="familiarPagoId.set($event)"
          >
            <option value="">Sin especificar</option>
            <option *ngFor="let f of familiares" [value]="f.id">
              {{ f.nombre }} {{ f.apellidos }}
              <ng-container *ngIf="f.esResponsablePago"> ★</ng-container>
            </option>
          </select>
        </div>

        <!-- Notas (opcional) -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-chat-text me-1"></i>Notas
            <span class="text-muted fw-normal">(opcional)</span>
          </label>
          <textarea
            class="form-control"
            rows="2"
            placeholder="Observaciones sobre este bono..."
            [ngModel]="notas()"
            (ngModelChange)="notas.set($event)"
          ></textarea>
        </div>

        <!-- Error -->
        <div *ngIf="error()" class="alert alert-danger py-2 mb-0 small">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="modal-card-footer">
      <button class="btn btn-outline-secondary" (click)="cerrar.emit()" [disabled]="isLoading()">
        Cancelar
      </button>
      <button
        class="btn btn-primary"
        (click)="submit()"
        [disabled]="isLoading() || !precioInput() || sesionesFinales < 1"
      >
        <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!isLoading()" class="bi bi-check-circle me-2"></i>
        {{ isLoading() ? 'Creando...' : 'Crear bono' }}
      </button>
    </div>

  </div>
</div>
