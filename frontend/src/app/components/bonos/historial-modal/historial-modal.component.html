<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-card-header">
      <div class="modal-card-icon icon-historial">
        <i class="bi bi-download"></i>
      </div>
      <div>
        <h5 class="mb-0">Exportar historial</h5>
        <p class="text-muted small mb-0">Descarga sesiones o bonos en PDF o Excel</p>
      </div>
      <button class="btn-close-modal" (click)="cerrar.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-card-body">
      <div class="historial-form">

        <!-- Tipo de datos -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-table me-1"></i>¿Qué deseas exportar?
          </label>
          <div class="sesiones-selector">
            <button
              class="sesiones-btn"
              [class.active]="tipo() === 'sesiones'"
              type="button"
              (click)="tipo.set('sesiones')"
            >
              <i class="bi bi-calendar-check me-1"></i>Sesiones
            </button>
            <button
              class="sesiones-btn"
              [class.active]="tipo() === 'bonos'"
              type="button"
              (click)="tipo.set('bonos')"
            >
              <i class="bi bi-ticket-perforated me-1"></i>Bonos
            </button>
          </div>
        </div>

        <!-- Rango de fechas -->
        <div class="historial-fechas-row">
          <div class="form-group-custom">
            <label class="form-label-custom">
              <i class="bi bi-calendar me-1"></i>Desde
              <span class="text-muted fw-normal">(opcional)</span>
            </label>
            <input
              type="date"
              class="form-control"
              [ngModel]="fechaDesde()"
              (ngModelChange)="fechaDesde.set($event)"
            />
          </div>
          <div class="form-group-custom">
            <label class="form-label-custom">
              <i class="bi bi-calendar me-1"></i>Hasta
              <span class="text-muted fw-normal">(opcional)</span>
            </label>
            <input
              type="date"
              class="form-control"
              [ngModel]="fechaHasta()"
              (ngModelChange)="fechaHasta.set($event)"
            />
          </div>
        </div>

        <!-- Toggle todos los clientes (solo bonos) -->
        <div *ngIf="showAllClients()" class="form-group-custom">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="todosClientes"
              [ngModel]="todosClientes()"
              (ngModelChange)="todosClientes.set($event)"
            />
            <label class="form-check-label" for="todosClientes">
              Incluir bonos de <strong>todos los clientes</strong>
            </label>
          </div>
        </div>

        <!-- Formato -->
        <div class="form-group-custom">
          <label class="form-label-custom">
            <i class="bi bi-file-earmark me-1"></i>Formato de descarga
          </label>
          <div class="sesiones-selector">
            <button
              class="sesiones-btn"
              [class.active]="formato() === 'pdf'"
              type="button"
              (click)="formato.set('pdf')"
            >
              <i class="bi bi-file-earmark-pdf me-1"></i>PDF
            </button>
            <button
              class="sesiones-btn"
              [class.active]="formato() === 'excel'"
              type="button"
              (click)="formato.set('excel')"
            >
              <i class="bi bi-file-earmark-excel me-1"></i>Excel
            </button>
          </div>
        </div>

        <!-- Error -->
        <div *ngIf="error()" class="alert alert-danger py-2 mb-0 small">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="modal-card-footer">
      <button
        class="btn btn-outline-secondary"
        (click)="cerrar.emit()"
        [disabled]="isLoading()"
      >
        Cancelar
      </button>
      <button
        class="btn btn-primary"
        (click)="exportar()"
        [disabled]="isLoading()"
      >
        <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!isLoading()" class="bi bi-download me-2"></i>
        {{ isLoading() ? 'Generando...' : 'Exportar' }}
      </button>
    </div>

  </div>
</div>
