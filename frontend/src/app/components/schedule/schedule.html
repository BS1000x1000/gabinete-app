<!-- schedule.component.html -->
<div class="d-flex align-items-center mb-2">
  <div class="btn-group btn-group-sm ms-auto" role="group">
    <button class="btn btn-outline-primary"
            [class.active]="view() === CalendarView.Week"
            (click)="setView(CalendarView.Week)">Semana</button>
    <button class="btn btn-outline-primary"
            [class.active]="view() === CalendarView.Day"
            (click)="setView(CalendarView.Day)">Día</button>
  </div>
</div>

<div class="calendar-container">
  <mwl-calendar-week-view *ngIf="view() === CalendarView.Week"
    [viewDate]="viewDate()"
    [events]="events()"
    [dayStartHour]="startHour"
    [dayEndHour]="endHour"
    [hourSegments]="2">
  </mwl-calendar-week-view>

  <mwl-calendar-day-view *ngIf="view() === CalendarView.Day"
    [viewDate]="viewDate()"
    [events]="events()"
    [dayStartHour]="startHour"
    [dayEndHour]="endHour"
    [hourSegments]="2">
  </mwl-calendar-day-view>
</div>
