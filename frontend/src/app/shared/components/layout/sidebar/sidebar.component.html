<aside class="sidebar">

  <!-- ── Marca ─────────────────────────────── -->
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">
      <i class="bi bi-grid-3x3-gap-fill"></i>
    </div>
    <span class="sidebar-brand-name">Gabinete</span>
  </div>

  <!-- ── Navegación principal ──────────────── -->
  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
      <a
        class="sidebar-nav-item"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [title]="item.label"
      >
        <i [class]="'bi ' + item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- ── Separador ────────────────────────────── -->
  <div class="sidebar-divider"></div>

  <!-- ── Acciones rápidas ───────────────────── -->
  <div class="sidebar-actions">
    <p class="sidebar-actions-label">Acciones rápidas</p>
    @for (action of quickActions(); track action.action) {
      <button
        class="sidebar-action-btn"
        (click)="handleQuickAction(action.action)"
        type="button"
      >
        <i [class]="'bi ' + action.icon"></i>
        <span>{{ action.label }}</span>
      </button>
    }
  </div>

  <!-- ── Perfil de usuario ─────────────────── -->
  <div class="sidebar-profile">
    <div class="sidebar-profile-avatar">{{ userInitials() }}</div>
    <div class="sidebar-profile-info">
      <span class="sidebar-profile-name">{{ userName() }}</span>
      <span class="sidebar-profile-role">{{ userRole() }}</span>
    </div>
    <button
      class="sidebar-profile-logout"
      (click)="logout()"
      title="Cerrar sesión"
      type="button"
    >
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>


  <!-- ── Legal ────────────────────────────────── -->
  <div class="sidebar-legal">
    <a class="sidebar-legal-link" routerLink="/legal/privacidad" title="Política de Privacidad">
      <i class="bi bi-shield-lock"></i>
      <span>Privacidad</span>
    </a>
    <a class="sidebar-legal-link" routerLink="/legal/aviso-legal" title="Aviso Legal">
      <i class="bi bi-file-text"></i>
      <span>Aviso legal</span>
    </a>
  </div>

</aside>
