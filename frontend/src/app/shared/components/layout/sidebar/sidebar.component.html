<!-- sidebar.component.html -->
<nav
  class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-light border-end"
  [class.collapsed]="collapsed()"
>
  <!-- Brand + toggle -->
  <div class="d-flex align-items-center mb-3">
    <a class="navbar-brand fw-bold text-primary" routerLink="/home">
      <i class="bi bi-speedometer2 fs-4"></i>
      <span class="ms-2 brand-text" *ngIf="!collapsed()">Gabinete</span>
    </a>
    <button
      class="btn btn-sm btn-outline-secondary ms-auto d-lg-none"
      (click)="sidebar.toggle()"
    >
      <i class="bi bi-list"></i>
    </button>
  </div>

  <!-- Quick search -->
  <div class="mb-3" *ngIf="!collapsed()">
    <input
      class="form-control form-control-sm"
      type="search"
      placeholder="Buscar..."
      [value]="search()"
      (input)="onSearchInput($event)"
    />
  </div>

  <!-- Navigation -->
  <ul class="nav nav-pills flex-column mb-auto">
    <li *ngFor="let item of filteredItems()">
      <a
        class="nav-link link-dark d-flex align-items-center"
        [routerLink]="item.route"
        routerLinkActive="active"
      >
        <i class="bi bi-{{ item.icon }} fs-5"></i>
        <span class="ms-2" *ngIf="!collapsed()">{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <!-- Footer -->
  <div class="mt-auto">
    <hr *ngIf="!collapsed()" />
    <button class="btn btn-sm btn-outline-danger w-100" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span class="ms-2" *ngIf="!collapsed()">Log out</span>
    </button>
  </div>
</nav>
