<aside class="sidebar" [class.collapsed]="collapsed()">
  
  <!-- Header del sidebar -->
  <div class="sidebar-header">
    <div class="brand" *ngIf="!collapsed()">
      <i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>
      <span class="brand-text fw-bold">Gabinete</span>
    </div>
    <button 
      class="btn btn-link text-dark p-0" 
      (click)="toggleSidebar()"
      [title]="collapsed() ? 'Expandir' : 'Contraer'"
    >
      <i class="bi" [ngClass]="collapsed() ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
    </button>
  </div>

  <!-- Navegación -->
  <nav class="sidebar-nav">
    <ul class="nav flex-column">
      <li class="nav-item" *ngFor="let item of menuItems">
        <a 
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="collapsed() ? item.label : ''"
        >
          <i class="bi" [ngClass]="item.icon"></i>
          <span *ngIf="!collapsed()" class="ms-2">{{ item.label }}</span>
          <span 
            *ngIf="item.badge && !collapsed()" 
            class="badge bg-danger ms-auto"
          >
            {{ item.badge }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer del sidebar (opcional) -->
  <div class="sidebar-footer" *ngIf="!collapsed()">
    <small class="text-muted">
      <i class="bi bi-info-circle me-1"></i>
      v1.0.0
    </small>
  </div>

</aside>
