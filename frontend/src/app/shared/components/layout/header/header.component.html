<!-- header.component.html -->
<header class="top-bar d-flex align-items-center px-3 py-2 bg-white shadow-sm m-2">
  <!-- Center: search (expandible) -->
  <div class="mx-auto w-50">
    <input
      type="search"
      class="form-control form-control-sm ms-2 w-100"
      placeholder="Buscar..."
      (keydown.Enter)="header.searchOpen.set(false)"
    />
  </div>

  <!-- Right: notificaciones + avatar + logout -->
  <div class="d-flex align-items-center gap-3">
    <!-- notificaciones -->
    <app-notification-bell></app-notification-bell>

    <!-- avatar + nombre -->
    <div class="d-none d-md-flex align-items-center gap-2">
      <div
        class="avatar-sm rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center fw-semibold"
      >
        {{ userName.charAt(0) }}{{ userSurname.charAt(0) }}
      </div>
      <div class="lh-1">
        <div class="fw-semibold">{{ userName }} {{ userSurname }}</div>
        <small class="text-muted text-capitalize">{{ role }}</small>
      </div>
    </div>

    <!-- logout -->
    <button class="btn btn-sm btn-outline-danger" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>
