<div class="perfil-tab">

  <!-- Sin permiso -->
  <div *ngIf="!tieneAcceso()" class="trab-empty-state">
    <i class="bi bi-shield-x"></i>
    <p>Sin acceso</p>
    <span>No tienes permiso para gestionar las credenciales de este profesional.</span>
  </div>

  <ng-container *ngIf="tieneAcceso()">

    <div class="trab-section-hdr mb-3">
      <span class="trab-section-title">
        <i class="bi bi-shield-lock me-2"></i>Cambiar contraseña
      </span>
    </div>

    <!-- Éxito -->
    <div *ngIf="exito()" class="trab-alert-exito mb-3">
      <i class="bi bi-check-circle-fill me-2"></i>{{ exito() }}
    </div>

    <!-- Error -->
    <div *ngIf="error()" class="alert alert-danger py-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error() }}
      <button type="button" class="btn-close float-end" (click)="error.set(null)"></button>
    </div>

    <div class="perfil-card trab-edit-card" style="max-width: 480px;">
      <div class="perfil-card-body">

        <!-- Contraseña actual -->
        <div class="mb-3">
          <label class="form-label">Contraseña actual <span class="text-danger">*</span></label>
          <div class="input-icon-wrap">
            <input
              [type]="hideActual() ? 'password' : 'text'"
              class="form-control form-control-sm"
              [value]="form().passwordActual"
              (input)="updateField('passwordActual', $any($event.target).value)"
              autocomplete="current-password"
            />
            <button type="button" class="input-eye-btn" (click)="hideActual.set(!hideActual())" tabindex="-1">
              <i class="bi" [class.bi-eye]="hideActual()" [class.bi-eye-slash]="!hideActual()"></i>
            </button>
          </div>
        </div>

        <!-- Nueva contraseña -->
        <div class="mb-1">
          <label class="form-label">Nueva contraseña <span class="text-danger">*</span></label>
          <div class="input-icon-wrap">
            <input
              [type]="hideNueva() ? 'password' : 'text'"
              class="form-control form-control-sm"
              [value]="form().passwordNueva"
              (input)="updateField('passwordNueva', $any($event.target).value)"
              autocomplete="new-password"
            />
            <button type="button" class="input-eye-btn" (click)="hideNueva.set(!hideNueva())" tabindex="-1">
              <i class="bi" [class.bi-eye]="hideNueva()" [class.bi-eye-slash]="!hideNueva()"></i>
            </button>
          </div>
        </div>

        <!-- Indicador de fuerza -->
        <div *ngIf="strength().level > 0" class="password-strength mb-3">
          <div class="password-strength-bar">
            <div
              class="password-strength-fill"
              [style.width.%]="strength().level * 25"
              [style.background-color]="strength().color"
            ></div>
          </div>
          <span class="password-strength-label" [style.color]="strength().color">
            {{ strength().label }}
          </span>
        </div>
        <div *ngIf="strength().level === 0" class="mb-3">
          <div class="form-text">Mín. 8 caracteres, mayúscula y número.</div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="mb-1">
          <label class="form-label">Confirmar nueva contraseña <span class="text-danger">*</span></label>
          <div class="input-icon-wrap">
            <input
              [type]="hideConfirmar() ? 'password' : 'text'"
              class="form-control form-control-sm"
              [class.is-invalid]="form().passwordConfirmar && !passwordsMatch()"
              [value]="form().passwordConfirmar"
              (input)="updateField('passwordConfirmar', $any($event.target).value)"
              autocomplete="new-password"
            />
            <button type="button" class="input-eye-btn" (click)="hideConfirmar.set(!hideConfirmar())" tabindex="-1">
              <i class="bi" [class.bi-eye]="hideConfirmar()" [class.bi-eye-slash]="!hideConfirmar()"></i>
            </button>
          </div>
        </div>

        <!-- Match hint — always reserves space to avoid layout jump -->
        <div
          class="password-match-hint mb-3"
          [class.match-ok]="passwordsMatch()"
          [class.match-fail]="!passwordsMatch()"
          [style.visibility]="form().passwordConfirmar ? 'visible' : 'hidden'"
        >
          <i class="bi" [class.bi-check-circle-fill]="passwordsMatch()" [class.bi-x-circle-fill]="!passwordsMatch()"></i>
          {{ passwordsMatch() ? 'Las contraseñas coinciden' : 'Las contraseñas no coinciden' }}
        </div>

      </div>

      <div class="trab-edit-footer">
        <button
          class="btn btn-sm btn-primary"
          type="button"
          [disabled]="guardando()"
          (click)="guardar()"
        >
          <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-1"></span>
          <i *ngIf="!guardando()" class="bi bi-lock me-1"></i>
          {{ guardando() ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
      </div>
    </div>

  </ng-container>

</div>
