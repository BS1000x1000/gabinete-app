<div class="app-layout">

  <!-- Overlay para cerrar sidebar en móvil -->
  <div
    *ngIf="mobileSidebarOpen()"
    class="sidebar-overlay d-lg-none"
    (click)="toggleMobileSidebar()"
  ></div>

  <!-- Sidebar de navegación -->
  <app-sidebar [class.show]="mobileSidebarOpen()"></app-sidebar>

  <!-- Contenedor principal -->
  <div class="app-content">

    <!-- Header -->
    <header class="app-header">
      <div class="app-header-inner">

        <!-- Botón menú móvil -->
        <button class="btn btn-link text-dark p-0 d-lg-none" (click)="toggleMobileSidebar()">
          <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Barra de búsqueda -->
        <app-search-bar></app-search-bar>

        <!-- Acciones de cabecera -->
        <div class="app-header-actions">
          <app-notification-bell></app-notification-bell>
        </div>

      </div>
    </header>

    <!-- Contenido de las rutas -->
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>

<!-- Drawer global de Registro Diario -->
<app-drawer-registro></app-drawer-registro>

<!-- Modal global de Nueva Sesión -->
<app-nueva-sesion-modal></app-nueva-sesion-modal>
