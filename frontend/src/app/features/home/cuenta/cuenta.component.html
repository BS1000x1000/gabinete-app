<div class="cuenta-page">

  <div class="cuenta-header">
    <h5 class="cuenta-header-title">Mi cuenta</h5>
    <p class="cuenta-header-sub">Gestiona tu contraseña y acceso</p>
  </div>

  <div class="cuenta-grid">

    <!-- ══ Card: Cambiar contraseña ══════════════════════════ -->
    <div class="card border-0 shadow-sm rounded-3 bg-white ajustes-card">
      <div class="ajustes-card-header">
        <i class="bi bi-shield-lock me-2"></i>Cambiar contraseña
      </div>
      <div class="ajustes-card-body">

        <p class="ajustes-section-desc">
          Introduce tu contraseña actual y elige una nueva de al menos 8 caracteres.
        </p>

        <div *ngIf="exito()" class="alert alert-success ajustes-alert d-flex align-items-center gap-2 mb-4">
          <i class="bi bi-check-circle-fill"></i>
          <span>Contraseña actualizada correctamente.</span>
        </div>

        <div *ngIf="error()" class="alert alert-danger ajustes-alert d-flex align-items-center gap-2 mb-4">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ error() }}</span>
        </div>

        <div class="ajustes-form">

          <div class="ajustes-field">
            <label class="ajustes-label">Contraseña actual</label>
            <div class="ajustes-input-wrap">
              <input
                [type]="mostrar().actual ? 'text' : 'password'"
                class="form-control ajustes-input"
                placeholder="Tu contraseña actual"
                autocomplete="current-password"
                [value]="form().passwordActual"
                (input)="setField('passwordActual', $any($event.target).value)"
              />
              <button type="button" class="ajustes-eye-btn" (click)="toggleMostrar('actual')"
                [title]="mostrar().actual ? 'Ocultar' : 'Mostrar'">
                <i class="bi" [class.bi-eye]="!mostrar().actual" [class.bi-eye-slash]="mostrar().actual"></i>
              </button>
            </div>
          </div>

          <div class="ajustes-field">
            <label class="ajustes-label">Nueva contraseña</label>
            <div class="ajustes-input-wrap">
              <input
                [type]="mostrar().nueva ? 'text' : 'password'"
                class="form-control ajustes-input"
                placeholder="Mínimo 8 caracteres"
                autocomplete="new-password"
                [value]="form().passwordNueva"
                (input)="setField('passwordNueva', $any($event.target).value)"
              />
              <button type="button" class="ajustes-eye-btn" (click)="toggleMostrar('nueva')"
                [title]="mostrar().nueva ? 'Ocultar' : 'Mostrar'">
                <i class="bi" [class.bi-eye]="!mostrar().nueva" [class.bi-eye-slash]="mostrar().nueva"></i>
              </button>
            </div>
            <span *ngIf="form().passwordNueva && form().passwordNueva.length < 8" class="ajustes-hint text-danger">
              <i class="bi bi-exclamation-circle me-1"></i>Mínimo 8 caracteres
            </span>
          </div>

          <div class="ajustes-field">
            <label class="ajustes-label">Confirmar nueva contraseña</label>
            <div class="ajustes-input-wrap">
              <input
                [type]="mostrar().confirmar ? 'text' : 'password'"
                class="form-control ajustes-input"
                placeholder="Repite la nueva contraseña"
                autocomplete="new-password"
                [value]="form().confirmar"
                (input)="setField('confirmar', $any($event.target).value)"
              />
              <button type="button" class="ajustes-eye-btn" (click)="toggleMostrar('confirmar')"
                [title]="mostrar().confirmar ? 'Ocultar' : 'Mostrar'">
                <i class="bi" [class.bi-eye]="!mostrar().confirmar" [class.bi-eye-slash]="mostrar().confirmar"></i>
              </button>
            </div>
            <span
              *ngIf="form().confirmar && form().passwordNueva && form().confirmar !== form().passwordNueva"
              class="ajustes-hint text-danger"
            >
              <i class="bi bi-exclamation-circle me-1"></i>Las contraseñas no coinciden
            </span>
          </div>

          <div class="ajustes-actions">
            <button
              type="button"
              class="btn btn-primary ajustes-submit-btn"
              (click)="cambiarPassword()"
              [disabled]="guardando()"
            >
              <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!guardando()" class="bi bi-floppy me-2"></i>
              {{ guardando() ? 'Guardando...' : 'Actualizar contraseña' }}
            </button>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>
