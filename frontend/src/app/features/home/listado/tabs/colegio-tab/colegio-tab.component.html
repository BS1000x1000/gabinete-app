<div class="tab-content-modern p-4">

  <!-- Si no hay datos del colegio -->
  <div *ngIf="!colegio()" class="alert alert-info">
    <i class="bi bi-info-circle me-2"></i>
    No hay información del colegio registrada
  </div>

  <ng-container *ngIf="colegio()">
    
    <!-- Sección: Datos del Centro -->
    <div class="section mb-1">
      <h6 class="section-title">
        <i class="bi bi-building me-2"></i>Datos del Centro Educativo
      </h6>
      <div class="data-grid">
        <app-data-field
          label="Nombre del centro"
          [value]="colegio()?.nombreDelCentro"
          icon="bi-building"
          [fullWidth]="true"
        ></app-data-field>

        <app-data-field
          label="Dirección"
          [value]="colegio()?.direccionColegio"
          icon="bi-geo-alt"
          [fullWidth]="true"
        ></app-data-field>

        <app-data-field
          label="Curso escolar"
          [value]="colegio()?.cursoEscolar"
          icon="bi-book"
        ></app-data-field>
      </div>
    </div>

    <!-- Sección: Adaptaciones -->
    <div class="section mb-1">
      <h6 class="section-title">
        <i class="bi bi-gear-fill me-2"></i>Adaptaciones Curriculares
      </h6>
      <div class="data-grid">
        <app-data-field
          label="Tiene adaptación curricular"
          [value]="sanitario()?.adaptaciones ? 'SÍ' : 'NO'"
          type="badge"
          [badgeClass]="sanitario()?.adaptaciones ? 'bg-success' : 'bg-secondary'"
          icon="bi-check-circle"
        ></app-data-field>

        <app-data-field
          *ngIf="sanitario()?.adaptaciones"
          label="Tipo de adaptación"
          [value]="sanitario()?.tipoAdaptaciones"
          icon="bi-list-ul"
        ></app-data-field>
      </div>
    </div>

    <!-- Sección: Contacto Principal del Colegio -->
    <div class="section mb-1" *ngIf="colegio()?.ctoColegioUno">
      <h6 class="section-title">
        <i class="bi bi-person-badge me-2"></i>Contacto Principal
      </h6>
      <div class="data-grid">
        <app-data-field
          label="Nombre"
          [value]="colegio()?.ctoColegioUno"
          icon="bi-person"
        ></app-data-field>

        <app-data-field
          label="Relación/Cargo"
          [value]="colegio()?.ctoRelacionColegioUno"
          icon="bi-briefcase"
        ></app-data-field>

        <app-data-field
          label="Teléfono"
          [value]="colegio()?.ctoTelefonoUno"
          type="phone"
          icon="bi-phone"
        ></app-data-field>

        <app-data-field
          label="Email"
          [value]="colegio()?.ctoEmailColegioUno"
          type="email"
          icon="bi-envelope"
        ></app-data-field>
      </div>
    </div>

    <!-- Sección: Contacto Secundario del Colegio -->
    <div class="section" *ngIf="colegio()?.ctoColegioDos">
      <h6 class="section-title">
        <i class="bi bi-person-badge me-2"></i>Contacto Secundario
      </h6>
      <div class="data-grid">
        <app-data-field
          label="Nombre"
          [value]="colegio()?.ctoColegioDos"
          icon="bi-person"
        ></app-data-field>

        <app-data-field
          label="Relación/Cargo"
          [value]="colegio()?.ctoRelacionColegioDos"
          icon="bi-briefcase"
        ></app-data-field>

        <app-data-field
          label="Teléfono"
          [value]="colegio()?.ctoTelefonoDos"
          type="phone"
          icon="bi-phone"
        ></app-data-field>

        <app-data-field
          label="Email"
          [value]="colegio()?.ctoEmailColegioDos"
          type="email"
          icon="bi-envelope"
        ></app-data-field>
      </div>
    </div>

  </ng-container>

</div>
