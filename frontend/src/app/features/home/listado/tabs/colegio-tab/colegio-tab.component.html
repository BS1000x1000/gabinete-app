<div class="tab-content-modern p-4">

  <div *ngIf="error()" class="alert alert-danger alert-dismissible py-2 mb-3">
    <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
    <button type="button" class="btn-close" (click)="error.set(null)"></button>
  </div>

  <!-- Sin datos -->
  <div *ngIf="!colegio()" class="text-center py-5 text-muted">
    <i class="bi bi-building display-4"></i>
    <p class="mt-3">No hay información del centro educativo registrada.</p>
  </div>

  <ng-container *ngIf="colegio()">

    <!-- ══ DATOS DEL CENTRO ══ -->
    <div class="section mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="section-title mb-0"><i class="bi bi-building me-2"></i>Datos del Centro Educativo</h6>
        <div>
          <button *ngIf="seccionEditando() !== 'centro'" class="btn btn-sm btn-outline-primary" (click)="editar('centro')">
            <i class="bi bi-pencil me-1"></i>Editar
          </button>
          <ng-container *ngIf="seccionEditando() === 'centro'">
            <button class="btn btn-sm btn-primary me-2" [disabled]="guardando()" (click)="guardar()">
              <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!guardando()" class="bi bi-check-lg me-1"></i>{{ guardando() ? 'Guardando...' : 'Guardar' }}
            </button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Cancelar</button>
          </ng-container>
        </div>
      </div>

      <div *ngIf="seccionEditando() !== 'centro'" class="data-grid">
        <app-data-field label="Nombre del centro" [value]="colegio()?.nombreDelCentro" icon="bi-building" [fullWidth]="true"></app-data-field>
        <app-data-field label="Dirección"          [value]="colegio()?.direccionColegio" icon="bi-geo-alt" [fullWidth]="true"></app-data-field>
        <app-data-field label="Curso escolar"      [value]="colegio()?.cursoEscolar"    icon="bi-book"></app-data-field>
      </div>

      <div *ngIf="seccionEditando() === 'centro'" class="border rounded p-3 bg-light" [formGroup]="formCentro">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label small fw-semibold">Nombre del centro <span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" formControlName="nombre"
                   [class.is-invalid]="formCentro.get('nombre')?.invalid && formCentro.get('nombre')?.touched">
            <div class="invalid-feedback">Campo obligatorio</div>
          </div>
          <div class="col-md-8">
            <label class="form-label small fw-semibold">Dirección</label>
            <input class="form-control form-control-sm" formControlName="direccionColegio">
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Curso escolar</label>
            <input class="form-control form-control-sm" formControlName="cursoEscolar" placeholder="Ej: 3º Primaria">
          </div>
        </div>
      </div>
    </div>

    <!-- ══ CONTACTO PRINCIPAL ══ -->
    <div class="section mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="section-title mb-0"><i class="bi bi-person-badge me-2"></i>Contacto Principal del Centro</h6>
        <div>
          <button *ngIf="seccionEditando() !== 'contacto1'" class="btn btn-sm btn-outline-primary" (click)="editar('contacto1')">
            <i class="bi bi-pencil me-1"></i>Editar
          </button>
          <ng-container *ngIf="seccionEditando() === 'contacto1'">
            <button class="btn btn-sm btn-primary me-2" [disabled]="guardando()" (click)="guardar()">
              <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!guardando()" class="bi bi-check-lg me-1"></i>{{ guardando() ? 'Guardando...' : 'Guardar' }}
            </button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Cancelar</button>
          </ng-container>
        </div>
      </div>

      <div *ngIf="seccionEditando() !== 'contacto1'" class="data-grid">
        <app-data-field label="Nombre"        [value]="colegio()?.ctoColegioUno"         icon="bi-person"></app-data-field>
        <app-data-field label="Relación/Cargo"[value]="colegio()?.ctoRelacionColegioUno" icon="bi-briefcase"></app-data-field>
        <app-data-field label="Teléfono"      [value]="colegio()?.ctoTelefonoUno"        type="phone" icon="bi-phone"></app-data-field>
        <app-data-field label="Email"         [value]="colegio()?.ctoEmailColegioUno"    type="email" icon="bi-envelope"></app-data-field>
      </div>

      <div *ngIf="seccionEditando() === 'contacto1'" class="border rounded p-3 bg-light" [formGroup]="formContacto1">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" formControlName="ctoColegioUno"
                   [class.is-invalid]="formContacto1.get('ctoColegioUno')?.invalid && formContacto1.get('ctoColegioUno')?.touched">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Relación / Cargo</label>
            <input class="form-control form-control-sm" formControlName="ctoRelacionColegioUno" placeholder="Ej: Tutora, Orientadora...">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Teléfono <span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" formControlName="ctoTelefonoUno"
                   [class.is-invalid]="formContacto1.get('ctoTelefonoUno')?.invalid && formContacto1.get('ctoTelefonoUno')?.touched">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control form-control-sm" formControlName="ctoEmailColegioUno"
                   [class.is-invalid]="formContacto1.get('ctoEmailColegioUno')?.invalid && formContacto1.get('ctoEmailColegioUno')?.touched">
          </div>
        </div>
      </div>
    </div>

    <!-- ══ CONTACTO SECUNDARIO ══ -->
    <div class="section">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="section-title mb-0">
          <i class="bi bi-person-badge me-2"></i>Contacto Secundario del Centro
          <span class="badge bg-light text-muted border ms-2 fw-normal" style="font-size:.72rem">Opcional</span>
        </h6>
        <div>
          <button *ngIf="seccionEditando() !== 'contacto2'" class="btn btn-sm btn-outline-primary" (click)="editar('contacto2')">
            <i class="bi bi-pencil me-1"></i>Editar
          </button>
          <ng-container *ngIf="seccionEditando() === 'contacto2'">
            <button class="btn btn-sm btn-primary me-2" [disabled]="guardando()" (click)="guardar()">
              <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!guardando()" class="bi bi-check-lg me-1"></i>{{ guardando() ? 'Guardando...' : 'Guardar' }}
            </button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Cancelar</button>
          </ng-container>
        </div>
      </div>

      <div *ngIf="seccionEditando() !== 'contacto2'" class="data-grid">
        <app-data-field label="Nombre"        [value]="colegio()?.ctoColegioDos"         icon="bi-person"   emptyText="No registrado"></app-data-field>
        <app-data-field label="Relación/Cargo"[value]="colegio()?.ctoRelacionColegioDos" icon="bi-briefcase" emptyText="No registrado"></app-data-field>
        <app-data-field label="Teléfono"      [value]="colegio()?.ctoTelefonoDos"        type="phone" icon="bi-phone"   emptyText="No registrado"></app-data-field>
        <app-data-field label="Email"         [value]="colegio()?.ctoEmailColegioDos"    type="email" icon="bi-envelope" emptyText="No registrado"></app-data-field>
      </div>

      <div *ngIf="seccionEditando() === 'contacto2'" class="border rounded p-3 bg-light" [formGroup]="formContacto2">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Nombre</label>
            <input class="form-control form-control-sm" formControlName="ctoColegioDos">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Relación / Cargo</label>
            <input class="form-control form-control-sm" formControlName="ctoRelacionColegioDos">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Teléfono</label>
            <input class="form-control form-control-sm" formControlName="ctoTelefonoDos">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control form-control-sm" formControlName="ctoEmailColegioDos"
                   [class.is-invalid]="formContacto2.get('ctoEmailColegioDos')?.invalid && formContacto2.get('ctoEmailColegioDos')?.touched">
          </div>
        </div>
      </div>
    </div>

  </ng-container>
</div>
