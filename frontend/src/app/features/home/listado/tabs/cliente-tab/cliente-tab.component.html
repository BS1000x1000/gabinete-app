<div class="tab-content-modern p-4">
  
  <!-- Sección: Información Personal -->
  <div class="section mb-1">
    <h6 class="section-title">
      <i class="bi bi-person-fill me-2"></i>Información Personal
    </h6>
    <div class="data-grid">
      <app-data-field
        label="Nombre completo"
        [value]="cliente()?.nombre + ' ' + cliente()?.apellidos"
        icon="bi-person"
      ></app-data-field>

      <app-data-field
        label="Fecha de nacimiento"
        [value]="cliente()?.fechaNacimiento"
        type="date"
        icon="bi-calendar3"
      ></app-data-field>

      <app-data-field
        label="Edad"
        [value]="cliente()?.edad + ' años'"
        icon="bi-cake2"
      ></app-data-field>

      <app-data-field
        label="DNI"
        [value]="cliente()?.dni"
        icon="bi-card-text"
      ></app-data-field>
    </div>
  </div>

  <!-- Sección: Contacto -->
  <div class="section mb-1">
    <h6 class="section-title">
      <i class="bi bi-telephone-fill me-2"></i>Información de Contacto
    </h6>
    <div class="data-grid">
      <app-data-field
        label="Email"
        [value]="cliente()?.email"
        type="email"
        icon="bi-envelope"
      ></app-data-field>

      <app-data-field
        label="Teléfono"
        [value]="cliente()?.movil"
        type="phone"
        icon="bi-phone"
      ></app-data-field>

      <app-data-field
        label="Domicilio"
        [value]="cliente()?.domicilio"
        [fullWidth]="true"
        icon="bi-house"
      ></app-data-field>

      <app-data-field
        label="Provincia"
        [value]="cliente()?.provincia"
        icon="bi-geo-alt"
      ></app-data-field>

      <app-data-field
        label="Ciudad"
        [value]="cliente()?.ciudad"
        icon="bi-map"
      ></app-data-field>
    </div>
  </div>

  <!-- Sección: Información Académica -->
  <div class="section mb-1">
    <h6 class="section-title">
      <i class="bi bi-calendar-check-fill me-2"></i>Información del Gabinete
    </h6>
    <div class="data-grid">
      <app-data-field
        label="Fecha de inicio"
        [value]="cliente()?.fechaInicio"
        type="date"
        icon="bi-calendar-plus"
      ></app-data-field>

      <app-data-field
        label="Fecha de alta"
        [value]="cliente()?.fechaAlta"
        type="date"
        icon="bi-calendar-check"
      ></app-data-field>
    </div>
  </div>

  <!-- Sección: Autorizaciones -->
  <div class="section">
    <h6 class="section-title">
      <i class="bi bi-shield-check-fill me-2"></i>Autorizaciones
    </h6>
    <div class="data-grid">
      <app-data-field
        label="Autoriza datos personales"
        [value]="cliente()?.autorizaDatosPersonales ? 'SÍ' : 'NO'"
        type="badge"
        [badgeClass]="cliente()?.autorizaDatosPersonales ? 'bg-success' : 'bg-danger'"
        icon="bi-file-earmark-person"
      ></app-data-field>

      <app-data-field
        label="Autoriza uso de imagen"
        [value]="cliente()?.autorizaDatosImagen ? 'SÍ' : 'NO'"
        type="badge"
        [badgeClass]="cliente()?.autorizaDatosImagen ? 'bg-success' : 'bg-danger'"
        icon="bi-camera"
      ></app-data-field>
    </div>
  </div>

</div>
