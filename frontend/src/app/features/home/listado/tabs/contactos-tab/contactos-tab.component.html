<div class="tab-content-modern p-4">

  <!-- Si no hay contactos -->
  <div *ngIf="!contactosFamiliares() || contactosFamiliares()!.length === 0" class="alert alert-info">
    <i class="bi bi-info-circle me-2"></i>
    No hay contactos familiares registrados
  </div>

  <!-- Mostrar todos los contactos -->
  <div *ngFor="let contacto of contactosFamiliares(); let i = index" class="section mb-1">
    <h6 class="section-title">
      <i class="bi bi-person-fill me-2"></i>
      Contacto {{ i + 1 }}: {{ contacto.parentesco }}
    </h6>

    <div class="data-grid">
      <app-data-field
        label="Nombre completo"
        [value]="contacto.nombre + ' ' + contacto.apellidos"
        icon="bi-person"
      ></app-data-field>

      <app-data-field
        label="Parentesco"
        [value]="contacto.parentesco"
        icon="bi-diagram-3"
      ></app-data-field>

      <app-data-field
        label="DNI"
        [value]="contacto.dni"
        icon="bi-card-text"
      ></app-data-field>

      <app-data-field
        label="Teléfono"
        [value]="contacto.telefono"
        type="phone"
        icon="bi-phone"
      ></app-data-field>

      <app-data-field
        label="Email"
        [value]="contacto.email"
        type="email"
        icon="bi-envelope"
        [fullWidth]="true"
      ></app-data-field>

      <div *ngIf="contacto.esContactoPrincipal || contacto.esResponsablePago">
        <app-data-field
          *ngIf="contacto.esContactoPrincipal"
          label="Contacto principal"
          value="SÍ"
          type="badge"
          badgeClass="bg-primary"
          icon="bi-star-fill"
        ></app-data-field>

        <app-data-field
          *ngIf="contacto.esResponsablePago"
          label="Responsable de pago"
          value="SÍ"
          type="badge"
          badgeClass="bg-success"
          icon="bi-credit-card"
        ></app-data-field>
      </div>
    </div>
  </div>

</div>
