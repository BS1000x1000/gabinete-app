<div class="d-flex listado-wrapper d-flex flex-column flex-lg-row gap-3 p-3">
  <!-- COLUMNA IZQUIERDA – datos + botones -->
  <aside class="left-panel bg-white rounded shadow-sm p-3 justify-content-center">
    <!-- Logo / avatar -->
    <!-- <div class="text-center mb-3">
      <img
        src="assets/img/avatar.png"
        alt="Avatar"
        class="rounded-circle mb-2"
        width="80"
        height="80"
      />
    </div> -->
    <div class="d-flex justify-content-center">
      <div
        class="avatar-lg rounded-circle bg-secondary text-white mb-2 text-center"
      >
        MO
      </div>
    </div>

    <!-- Nombre y edad -->
    <h5 class="text-center mb-1">Martínez Osuna, Hugo</h5>
    <p class="text-center text-muted mb-3">11 años</p>

    <!-- 3 botones grandes -->
    <div class="d-flex mb-3 justify-content-center btn-group">
      <button class="btn btn-primary btn-sm">Imagen</button>
      <button class="btn btn-danger btn-sm">Alergias</button>
      <button class="btn btn-info btn-sm text-white">Medicación</button>
    </div>

    <!-- Alergias (solo lectura) -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Alergias</label>
      <span class="form-control form-control-sm" rows="2" readonly>
        No registradas</span
      >
    </div>

    <!-- Medicación (solo lectura) -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Medicación</label>
      <span class="form-control form-control-sm" rows="2" readonly>
        Medicación para tratar el exceso de micción</span
      >
    </div>

    <hr />

    <!-- 7 botones pequeños con iconos -->
    <div class="d-flex justify-content-center btn-group">
      <button class="btn btn-sm btn-outline-secondary" title="1">
        <i class="bi bi-person"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="2">
        <i class="bi bi-heart"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="3">
        <i class="bi bi-book"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="4">
        <i class="bi bi-telephone"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="5">
        <i class="bi bi-envelope"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="6">
        <i class="bi bi-calendar"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" title="7">
        <i class="bi bi-geo-alt"></i>
      </button>
    </div>
  </aside>

  <!-- COLUMNA DERECHA – tabs + contenido -->
  <section class="right-panel flex-grow-1 rounded p-1">
    <!-- Pestañas -->
    <ul class="nav nav-tabs nav-fill">
      <li class="nav-item" *ngFor="let t of tabs">
        <a
          class="nav-link text-black"
          [routerLink]="['./', t]"
          routerLinkActive="active"
          (click)="pestania.set(t)"
          style="cursor: pointer;"
        >
          {{ t | titlecase }}
        </a>
      </li>
    </ul>

    <!-- Contenido de la pestaña activa -->
    <router-outlet></router-outlet>
  </section>
</div>
