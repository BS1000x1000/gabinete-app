version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    container_name: n8n-local
    ports:
      - "5678:5678" # Puerto que usarás para acceder (http://localhost:5678)
    environment:
      # URL base para los webhooks locales
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      # Base de datos persistente
      - DB_TYPE=sqlite
      - DB_SQLITE_VACUUM=true
    volumes:
      # Persistencia de datos: guarda tus flujos y credenciales en tu disco duro
      - ~/.n8n:/home/node/.n8n