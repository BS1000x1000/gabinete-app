version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    container_name: n8n-local
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=sqlite
      - DB_SQLITE_VACUUM=true
      # URL del backend NestJS corriendo en tu máquina
      - GABINETE_API_URL=http://host.docker.internal:3000
    volumes:
      - ~/.n8n:/home/node/.n8n
    extra_hosts:
      # Permite a n8n alcanzar el NestJS que corre en tu PC (necesario en Linux; en Windows/Mac funciona solo)
      - "host.docker.internal:host-gateway"
