name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit + E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gabinete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gabinete_test
      SECRET: test-ci-secret
      NODE_ENV: test
      # Misma zona que produccion: las fechas de sesion se construyen en hora local
      TZ: Europe/Madrid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test -- --forceExit --ci

      - name: Run E2E tests
        run: npm run test:e2e -- --forceExit

  frontend:
    name: Frontend — build + tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El build es la mitad del valor de este job: Angular 19 typechequea las
      # plantillas, asi que caza errores que ningun test unitario ve.
      - name: Build de produccion
        run: npx ng build --configuration production

      # `ChromeHeadlessCI` ya esta definido en karma.conf.js con --no-sandbox,
      # que es lo que hace falta dentro del runner.
      - name: Tests unitarios
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
