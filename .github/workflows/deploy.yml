name: Deploy backend to Scaleway

on:
  push:
    branches:
      - main

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: ${{ secrets.SCW_REGISTRY_NAMESPACE }}
  IMAGE_NAME: gabinete-backend

# El job de despliegue tiene todos los secretos de infraestructura. No necesita
# escribir en el repositorio.
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Binario de una release fijada y verificado por checksum, no
      # `curl ... master | sh`. Este job tiene TODOS los secretos de despliegue y
      # ejecutaba a ciegas un script descargado de la rama principal de un
      # tercero: lo que se ejecutara dependia de como estuviera `master` ese dia.
      # Al subir de version hay que actualizar tambien el SHA256, que sale del
      # fichero SHA256SUMS de la propia release.
      - name: Install Scaleway CLI
        env:
          SCW_CLI_VERSION: 2.62.0
          SCW_CLI_SHA256: 7638c385c1a43a5d9022a63791769fd464e14314032a51411726f062f3053e67
        run: |
          set -euo pipefail
          url="https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          curl -fsSL -o scw "$url"
          echo "${SCW_CLI_SHA256}  scw" | sha256sum --check --status
          chmod +x scw
          sudo mv scw /usr/local/bin/scw
          scw version

      - name: Deploy to Scaleway Serverless Container
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          scw container container deploy \
            container-id=${{ secrets.SCW_CONTAINER_ID }} \
            image-uri=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
